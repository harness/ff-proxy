version: "3.9"
services:
  proxy:
    environment:
      - LOG_LEVEL=INFO
      - REDIS_ADDRESS=redis:6379
      - READ_REPLICA=false
      - AUTH_SECRET=foobar
      - PROXY_KEY=${PROXY_KEY}
    build:
      context: ./
      dockerfile: ./Dockerfile
    volumes:
      - ${CONFIG_VOLUME:-./config:/config}
      - ./tests/e2e/certs:/certs
    ports:
      - "7000:7000"
    depends_on:
      - redis

  redis:
    image: "redis:latest"
    ports:
      - "6379:6379"

  redis-mtls:
    image: "redis:latest"
    container_name: ff-proxy-redis-mtls
    ports:
      - "6380:6380"
    volumes:
      - ./tests/e2e/certs:/certs:ro
      - ./tests/e2e/redis-mtls.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "--tls", "--cert", "/certs/redis-client.crt", "--key", "/certs/redis-client.key", "--cacert", "/certs/redis-ca.crt", "-p", "6380", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  pushpin:
    image: "fanout/pushpin:1.41.0"
    ports:
      - "7999:7999"
      - "5560-5563:5560-5563"
      - "5555:5555"
