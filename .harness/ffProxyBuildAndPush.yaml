pipeline:
  name: ffProxyBuildAndPush
  identifier: ffProxyBuildAndPush
  projectIdentifier: Harness_Commons
  orgIdentifier: PROD
  description: to build and push the dockerHub Image
  tags:
    Owner: FFM
    TicketID: FFM-12741
  stages:
    - stage:
        name: test
        identifier: test
        description: to build and push the dockerHub Image
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - stepGroup:
                  name: buildTag
                  identifier: buildTag
                  steps:
                    - step:
                        type: BuildAndPushDockerRegistry
                        name: BuildAndPushDockerRegistry_2
                        identifier: BuildAndPushDockerRegistry_2
                        spec:
                          registryRef: account.docker_artifacts
                          repo: harness/ff-proxy
                          tags:
                            - <+codebase.tag>
                          baseImageConnectorRefs:
                            - org.garSetupRO
                          envVariables:
                            PLUGIN_BUILDX_LOAD: "true"
                    - step:
                        type: Run
                        name: Push to Docker Hub
                        identifier: pushToDockerHubTag
                        spec:
                          shell: Bash
                          envVariables:
                            DH_USER: harnesscie
                            DH_PASS: <+secrets.getValue("dockerHarnessCiePatRw")>
                            SRC_IMAGE: harness0.harness.io/oci/docker_artifacts/harness/ff-proxy:<+codebase.tag>
                            DEST_IMAGE: harness/ff-proxy:<+codebase.tag>
                          command: |-
                            set -e
                            echo "$DH_PASS" | docker login docker.io -u "$DH_USER" --password-stdin
                            docker tag "$SRC_IMAGE" "$DEST_IMAGE"
                            docker push "$DEST_IMAGE"
                  when:
                    stageStatus: Success
                    condition: <+codebase.tag>!=null
              - stepGroup:
                  name: buildBranch
                  identifier: buildBranch
                  steps:
                    - step:
                        type: BuildAndPushDockerRegistry
                        name: BuildAndPushDockerRegistry_1
                        identifier: BuildAndPushDockerRegistry_1
                        spec:
                          registryRef: account.docker_artifacts
                          repo: harness/ff-proxy
                          tags:
                            - <+codebase.branch>
                          baseImageConnectorRefs:
                            - org.garSetupRO
                          envVariables:
                            PLUGIN_BUILDX_LOAD: "true"
                    - step:
                        type: Run
                        name: Push to Docker Hub
                        identifier: pushToDockerHub
                        spec:
                          shell: Bash
                          envVariables:
                            DH_USER: harnessdev
                            DH_PASS: <+secrets.getValue("org.dockerharnessdevpwd")>
                            SRC_IMAGE: harness0.harness.io/oci/docker_artifacts/harness/ff-proxy:<+codebase.branch>
                            DEST_IMAGE: harnessdev/ff-proxy:<+codebase.branch>
                          command: |-
                            set -e
                            echo "$DH_PASS" | docker login docker.io -u "$DH_USER" --password-stdin
                            docker tag "$SRC_IMAGE" "$DEST_IMAGE"
                            docker push "$DEST_IMAGE"
                  when:
                    stageStatus: Success
                    condition: <+codebase.tag>==null
          caching:
            enabled: false
            paths: []
          buildIntelligence:
            enabled: false
  properties:
    ci:
      codebase:
        repoName: ff-proxy
        build: <+input>
        sparseCheckout: []
