version: "3.9"
services:
  primary:
    image: "harness/ff-proxy:2.0.9"
    environment:
      - LOG_LEVEL=INFO
      - PROXY_KEY=cf7217fb-0f95-4dbc-86ec-ac82e9f2bbd4
      - REDIS_ADDRESS=redis:6379
      - READ_REPLICA=false
      - AUTH_SECRET=foobar
    volumes:
      - ${CONFIG_VOLUME:-./config:/config}
    ports:
      - "7001:7000"

  replica:
    image: "harness/ff-proxy:2.0.9"
    environment:
      - LOG_LEVEL=INFO
      - REDIS_ADDRESS=redis:6379
      - READ_REPLICA=true
      - AUTH_SECRET=foobar
    volumes:
      - ${CONFIG_VOLUME:-./config:/config}
    ports:
      - "7002:7000"

  nginx:
    image: "nginx:latest"
    volumes:
      - ./config:/etc/nginx/conf.d/
      - ./certs/cert.crt:/etc/nginx/cert.crt
      - ./certs/cert.key:/etc/nginx/cert.pem
    ports:
      - "8000:443"
    depends_on:
      - primary
      - replica
  redis:
    image: "redis:latest"
    ports:
      - "6379:6379"
