version: "3.9"
services:
  proxy:
    image: "harness/ff-proxy:1.0.8"
    environment:
      - OFFLINE=false
      - ACCOUNT_IDENTIFIER=
      - ORG_IDENTIFIER=
      - ADMIN_SERVICE_TOKEN=
      - AUTH_SECRET=
      - REDIS_ADDRESS=redis:6379
      - API_KEYS=
    build:
      context: ./
      dockerfile: ./Dockerfile
    ports:
      - "7000:7000"
    depends_on:
      - redis

  redis:
    image: "redis:latest"
    ports:
      - "6379:6379"



