    upstream harness-config-api {
      server config.ff.harness.io:443;  # Specify HTTPS upstream
    }

    upstream harness-events-api {
      server events.ff.harness.io:443;  # New upstream server for metrics
    }

    server {
      listen 80;

      location /api/1.0/client/auth {
        proxy_pass https://config.ff.harness.io/api/1.0/client/auth;  # Full path in proxy_pass
        proxy_set_header Host config.ff.harness.io;  # Set correct host for upstream
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
      }

      # New location block for feature-configs endpoint with envParam
      location ~ ^/api/1.0/client/env/[^/]+/feature-configs {
        proxy_pass https://config.ff.harness.io;  # Upstream without the specific path to keep query parameters intact
        proxy_set_header Host config.ff.harness.io;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
      }

      # New location block for target-segments endpoint
      location ~ ^/api/1.0/client/env/[^/]+/target-segments {
        proxy_pass https://config.ff.harness.io;  # Upstream without the specific path
        proxy_set_header Host config.ff.harness.io;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
      }

      # New location block for SSE stream
      location /api/1.0/stream {
        proxy_pass https://config.ff.harness.io;  # Forward to the upstream server
        proxy_set_header Host config.ff.harness.io;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Required for SSE to keep the connection open
        proxy_http_version 1.1;  # Use HTTP/1.1 to support keep-alive
        proxy_set_header Connection '';  # Clear the Connection header to prevent closing the connection
        proxy_read_timeout 3600;  # Timeout for reading the response
        proxy_send_timeout 3600;  # Timeout for sending the request
      }

      # New location block for metrics, forwarding to events.ff.harness.io
      location ~ ^/api/1.0/metrics/[^/]+ {
        proxy_pass https://events.ff.harness.io;  # Forward to events API
        proxy_set_header Host events.ff.harness.io;  # Set Host header for upstream
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Allow POST method for this location
        proxy_method POST;  # Although not commonly used, this line could help in some scenarios.

        # Additional headers if needed
        proxy_set_header Content-Type $http_content_type;  # Preserve Content-Type if necessary
      }

      location /api/1.0/proxy/auth {
        proxy_pass https://config.ff.harness.io/api/1.0/proxy/auth;  # Full path in proxy_pass
        proxy_set_header Host config.ff.harness.io;  # Set correct host for upstream
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
      }

      location /api/1.0/proxy/config {
        proxy_pass https://config.ff.harness.io;  # Forward to base URL and append the requested URI
        proxy_set_header Host config.ff.harness.io;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
      }

    }
