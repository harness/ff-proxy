{{- if .Values.readReplica.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ff-proxy.readReplica.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ff-proxy.labels" . | nindent 4 }}
data:
  REDIS_ADDRESS: {{ .Values.redis.address }}
  REDIS_DB: "{{ .Values.redis.db }}"
  READ_REPLICA: "true"
  {{- if .Values.redis.tls.enabled }}
  # Redis mTLS configuration - all three certificate paths are required
  # mTLS is automatically enabled when all three paths are provided
  REDIS_MTLS_CA_CERT: {{ printf "%s/%s" .Values.redis.tls.mountPath .Values.redis.tls.secret.caCert | quote }}
  REDIS_MTLS_CLIENT_CERT: {{ printf "%s/%s" .Values.redis.tls.mountPath .Values.redis.tls.secret.clientCert | quote }}
  REDIS_MTLS_CLIENT_KEY: {{ printf "%s/%s" .Values.redis.tls.mountPath .Values.redis.tls.secret.clientKey | quote }}
  {{- if .Values.redis.tls.insecureSkipVerify }}
  REDIS_TLS_INSECURE_SKIP_VERIFY: "true"
  {{- end }}
  {{- if .Values.redis.tls.serverName }}
  REDIS_TLS_SERVER_NAME: {{ .Values.redis.tls.serverName | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.clientService }}
  CLIENT_SERVICE: {{ .Values.clientService }}
  {{- end }}
  {{- if .Values.metricService }}
  METRICS_SERVICE: {{ .Values.metricService }}
  {{- end }}
  {{- if .Values.metricPostDuration }}
  METRIC_POST_DURATION: {{ .Values.metricPostDuration }}
  {{- end }}
  {{- if .Values.heartbeatInterval }}
  HEARTBEAT_INTERVAL: {{ .Values.heartbeatInterval }}
  {{- end }}
  {{- if .Values.port }}
  PORT: {{ .Values.port }}
  {{- end }}
  {{- if .Values.tls.enabled }}
  TLS_ENABLED: "{{ .Values.tls.enabled }}"
  TLS_CERT: {{ .Values.tls.certPath }}
  TLS_KEY: {{ .Values.tls.keyPath }}
  {{- end }}
  {{- if .Values.bypassAuth }}
  BYPASS_AUTH: "{{ .Values.bypassAuth }}"
  {{- end }}
  {{- if .Values.logLevel }}
  LOG_LEVEL: {{ .Values.logLevel }}
  {{- end }}
  {{- if .Values.gcpProfilerEnabled }}
  GCP_PROFILER_ENABLED: "{{ .Values.gcpProfilerEnabled }}"
  {{- end }}
  {{- if .Values.pprof }}
  PPROF: "{{ .Values.pprof }}"
  {{- end }}
  {{- if .Values.metricsStreamMaxLen }}
  METRICS_STREAM_MAX_LEN: {{ .Values.metricsStreamMaxLen }}
  {{- end }}
{{- end }}